<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FBF3E4">
    <meta name="description" content="浏览校园社团和公开活动，在线报名、查看申请进度并管理社团活动。">
    <title>{% if config.get('CLOUD_TEST_MODE') %}测试站点 · {% endif %}校园社团活动管理系统 · 青禾</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#activities" aria-label="青禾，返回活动广场">
          <span class="brand-symbol" aria-hidden="true">禾</span>
          <span><strong>青禾</strong><small>校园社团与活动</small></span>
        </a>
        <div class="sidebar-caption">发现社团与活动</div>
        <nav id="navigation" aria-label="功能导航"></nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note"><span class="note-dot"></span>校园社团与活动</div>
          <p>校园社团活动管理系统</p>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div class="breadcrumb"><span>校园生活</span><span aria-hidden="true">/</span><strong id="page-label">活动广场</strong></div>
          <div id="account" class="account-area"></div>
        </header>
        {% if config.get('CLOUD_TEST_MODE') %}<div class="info-box cloud-notice" role="status">云端测试站点 · 仅用于部署流程验证</div>{% endif %}
        <main id="main" tabindex="-1"><div class="initial-loading" role="status">正在加载…</div></main>
        <footer class="footer"><span>青禾 · 校园社团活动</span><span>校园社团综合管理与协同平台</span></footer>
      </div>
    </div>
    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  </body>
</html>
